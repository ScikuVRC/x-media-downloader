<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand">
        <div class="logo">↓</div>
        <div>
          <h1>X Media</h1>
          <p>Download what’s on this page</p>
        </div>
      </div>
      <button id="refresh" class="icon-btn" title="Rescan page" aria-label="Rescan page">↻</button>
    </header>

    <section class="notice">
      <strong>Original quality</strong>
      <span>Photos use X’s <code>orig</code> variant. Videos use the highest-bitrate MP4 X exposes.</span>
    </section>

    <section class="toolbar">
      <div><span id="count">0</span> media found</div>
      <button id="downloadAll" class="secondary" disabled>Download originals</button>
    </section>

    <section id="status" class="status">Scanning the current X page…</section>
    <section id="mediaList" class="media-list" aria-live="polite"></section>

    <footer>
      GIF opens the X post in Snaplytics and automatically submits the post link so it is ready for conversion.
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
